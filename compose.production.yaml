name: boda-production
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: boda
      POSTGRES_DB: boda_production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boda -d boda_production"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    image: boda-app:${APP_RELEASE:-latest}
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    env_file: .env.production
    environment:
      RAILS_ENV: production
      DATABASE_HOST: db
      DATABASE_USER: boda
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      APP_PORT: ""
      APP_PROTOCOL: https
      SEED_DEMO: "false"
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/up')).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Falta APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Falta ACME_EMAIL}
      DO_AUTH_TOKEN: ${DO_AUTH_TOKEN:?Falta DO_AUTH_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
volumes:
  postgres_data:
  storage:
  caddy_data:
  caddy_config:
